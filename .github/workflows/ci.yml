name: Build and test

on:
  push:
    branches: [dev, enhancements]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # No signing secrets are needed: debug builds are signed with the runner's debug key.
      CI_USE_DEBUG_SIGNING: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Only platform-tools: the default also asks for the retired "tools" package, which fails.
      # The Gradle plugin installs the SDK platform and build tools it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
